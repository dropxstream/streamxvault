<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Watch — Official StreamXvault</title>
  <meta name="description" content="Watch videos on StreamXvault — your premium streaming platform.">
  <meta name="keywords" content="StreamXvault, watch video, streaming, online streaming">
  <meta name="robots" content="index, follow">
  <!-- Resource Hints -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" href="/css/style.css" as="style">
  
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">
  <!-- Video.js Player -->
  <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
  <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar" id="navbar">
    <a href="/" class="nav-brand" id="nav-brand">
      <img src="/images/logo.png" alt="StreamXvault Logo" class="brand-logo">
      StreamXvault
    </a>
    <div class="nav-center">
      <div class="nav-search">
        <span class="search-icon">🔍</span>
        <input type="text" id="search-input" placeholder="Search videos..." autocomplete="off">
      </div>
    </div>
    <div class="nav-right">
      <a href="/" class="nav-link" id="nav-home">Home</a>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="main-content">
    <div class="player-container animate-fade-in">
      <!-- Video Player -->
      <div class="video-player-wrapper" id="player-wrapper">
        <video id="video-player" class="video-js vjs-big-play-centered vjs-16-9" controls preload="auto" width="640" height="264">
          <p class="vjs-no-js">
            To view this video please enable JavaScript, and consider upgrading to a web browser that
            <a href="https://videojs.com/html5-video-support/" target="_blank">supports HTML5 video</a>
          </p>
        </video>
      </div>

      <!-- Video Info -->
      <div class="video-info" id="video-info">
        <h1 id="video-title">Loading...</h1>
        <div class="video-meta" id="video-meta">
          <span id="video-views">— views</span>
          <span id="video-date">—</span>
        </div>

        <div class="video-actions">
          <button id="like-btn" class="action-btn" onclick="likeVideo()">
            <span class="icon">❤️</span> <span id="like-count">0</span>
          </button>
          
          <div class="download-dropdown">
            <button class="action-btn" onclick="toggleDownloadMenu(event)">
              <span class="icon">📥</span> Download
            </button>
            <div class="download-menu" id="download-menu">
              <!-- Populated by JS -->
              <div class="download-item" style="color: var(--text-muted); font-size: 0.8rem;">No links available</div>
            </div>
          </div>
        </div>
        <div class="video-description" id="video-description">—</div>
      </div>

      <!-- Native Banner Adsterra -->
      <div style="margin: 2rem 0; width: 100%; display: flex; justify-content: center; overflow: hidden; background: var(--bg-dark); border-radius:12px;">
        <script async="async" data-cfasync="false" src="https://bowlsharp.com/6eca3e3917ad590e081357c50e20d72c/invoke.js"></script>
        <div id="container-6eca3e3917ad590e081357c50e20d72c"></div>
      </div>
      
      <!-- 320x50 Banner Adsterra (Mobile Optimized) -->
      <div style="margin: 1rem 0; width: 100%; display: flex; justify-content: center; overflow: hidden;">
        <script>
          atOptions = {
            'key' : 'a7241d3bdd04b586c438907b8a290b35',
            'format' : 'iframe',
            'height' : 50,
            'width' : 320,
            'params' : {}
          };
        </script>
        <script src="https://bowlsharp.com/a7241d3bdd04b586c438907b8a290b35/invoke.js"></script>
      </div>

      <!-- Related Videos -->
      <section class="section">
        <div class="section-header">
          <h2 class="section-title"><span class="icon">📺</span> More Videos</h2>
        </div>
        <div class="video-grid" id="related-grid"></div>
      </section>
    </div>

    <!-- Footer -->
    <footer class="footer">
      <div class="container">
        <div class="footer-content">
          <span class="footer-brand">StreamXvault</span>
          <span class="footer-text">© 2026 StreamXvault. All rights reserved.</span>
        </div>
      </div>
    </footer>
  </main>

  <!-- Toast Container -->
  <div class="toast-container" id="toast-container"></div>

  <script src="/js/player.js"></script>
  
  <!-- Social Bar Adsterra -->
  <script src="https://bowlsharp.com/c5/a5/db/c5a5db053ff912757548714c63e29bc0.js"></script>
</body>
</html>
