<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Watch — StreamXvault</title>
  <meta name="description" content="Watch videos on StreamXvault — your premium streaming platform.">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar" id="navbar">
    <a href="/" class="nav-brand" id="nav-brand">
      <img src="/images/logo.png" alt="StreamXvault Logo" class="brand-logo">
      StreamXvault
    </a>
    <div class="nav-center">
      <div class="nav-search">
        <span class="search-icon">🔍</span>
        <input type="text" id="search-input" placeholder="Search videos..." autocomplete="off">
      </div>
    </div>
    <div class="nav-right">
      <a href="/" class="nav-link" id="nav-home">Home</a>
      <a href="/admin" class="btn btn-secondary btn-sm" id="nav-admin">🔐 Admin</a>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="main-content">
    <div class="player-container animate-fade-in">
      <!-- Video Player -->
      <div class="video-player-wrapper" id="player-wrapper">
        <video id="video-player" controls autoplay>
          Your browser does not support the video tag.
        </video>
      </div>

      <!-- Video Info -->
      <div class="video-info" id="video-info">
        <h1 id="video-title">Loading...</h1>
        <div class="video-meta" id="video-meta">
          <span id="video-views">— views</span>
          <span id="video-date">—</span>
        </div>
        <div class="video-description" id="video-description">—</div>
      </div>

      <!-- Related Videos -->
      <section class="section">
        <div class="section-header">
          <h2 class="section-title"><span class="icon">📺</span> More Videos</h2>
        </div>
        <div class="video-grid" id="related-grid"></div>
      </section>
    </div>

    <!-- Footer -->
    <footer class="footer">
      <div class="container">
        <div class="footer-content">
          <span class="footer-brand">StreamXvault</span>
          <span class="footer-text">© 2026 StreamXvault. All rights reserved.</span>
        </div>
      </div>
    </footer>
  </main>

  <!-- Toast Container -->
  <div class="toast-container" id="toast-container"></div>

  <script src="/js/player.js"></script>
</body>
</html>
