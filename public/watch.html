<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Watch — Official StreamXvault</title>
  <meta name="description" content="Watch videos on StreamXvault — your premium streaming platform.">
  <meta name="42f2f9e69682e7f764355082a0837d6ed489658b" content="42f2f9e69682e7f764355082a0837d6ed489658b" />
  <meta name="keywords" content="StreamXvault, watch video, streaming, online streaming">
  <meta name="robots" content="index, follow">
  <meta name="referrer" content="no-referrer-when-downgrade" />
  <script id="aclib" type="text/javascript" async src="//acscdn.com/script/aclib.js" onload="aclib.runVideoSlider({zoneId: '11262190'});"></script>

  <!-- Resource Hints -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" href="/css/style.css" as="style">
  
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap">
  <link rel="stylesheet" href="/css/style.css?v=4">
  <link rel="icon" type="image/png" href="/favicon.png">
  <!-- Plyr Player -->
  <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
  <style>
    /* Prevent Plyr from collapsing during HLS load */
    .plyr {
      height: 100% !important;
      width: 100% !important;
      border-radius: 16px;
      overflow: hidden;
    }
    .plyr__video-wrapper {
      height: 100% !important;
      width: 100% !important;
      background: #000;
    }
    .plyr video {
      object-fit: contain !important;
      height: 100% !important;
      width: 100% !important;
    }
  </style>

</head>
<body>
  <!-- Navbar -->
  <nav class="navbar" id="navbar">
    <a href="/" class="nav-brand" id="nav-brand">
      <img src="/images/logo.png" alt="StreamXvault Logo" class="brand-logo">
      StreamXvault
    </a>
    <div class="nav-center">
      <div class="nav-search">
        <span class="search-icon" aria-hidden="true">🔍</span>
        <input type="text" id="search-input" placeholder="Search videos..." autocomplete="off" aria-label="Search videos">
      </div>
    </div>
    <div class="nav-right">
      <a href="/" class="nav-link" id="nav-home">Home</a>
      <a href="/demand.html" class="nav-link" id="nav-demand">Demand Video</a>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="main-content">
    
    <!-- Top Leaderboard Ad (728x90) -->
    <div class="ad-banner-wrapper ad-banner-top">
      <script type="text/javascript">
        aclib.runBanner({
            zoneId: '11262238',
        });
      </script>
    </div>
    <div class="player-container animate-fade-in">
      <!-- Video Player -->
      <div class="video-player-wrapper" id="player-wrapper">
        <div style="position:relative; padding-top:56.25%; background: #000; border-radius: 16px; overflow: hidden;">
          <div style="position:absolute;top:0;left:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#888;font-size:1rem;">Loading player...</div>
        </div>
      </div>

      <!-- Video Info -->
      <div class="video-info" id="video-info">
        <h1 id="video-title">Loading...</h1>
        <div class="video-meta" id="video-meta">
          <span id="video-views">— views</span>
          <span id="video-date">—</span>
        </div>

        <div class="video-actions">
          <button id="like-btn" class="action-btn" onclick="likeVideo()" aria-label="Like this video">
            <span class="icon" aria-hidden="true">❤️</span> <span id="like-count">0</span>
          </button>
          
          <div class="download-dropdown" role="group" aria-label="Download options">
            <button class="action-btn" onclick="toggleDownloadMenu(event)" aria-haspopup="true" aria-label="Download options">
              <span class="icon" aria-hidden="true">📥</span> Download
            </button>
            <div class="download-menu" id="download-menu" role="menu">
              <!-- Populated by JS -->
              <div class="download-item" style="color: var(--text-muted); font-size: 0.8rem;">No links available</div>
            </div>
          </div>
        </div>
        <div class="video-description" id="video-description">—</div>

        <!-- Banner Ad Spot -->
        <div class="ad-banner-wrapper" style="margin: 2rem 0; display: flex; justify-content: center;">
          <script type="text/javascript">
            aclib.runBanner({
                zoneId: '11262194',
            });
          </script>
        </div>
      </div>

      <!-- Related Videos -->
      <section class="section">
        <div class="section-header">
          <div style="display: flex; align-items: center; gap: 0.5rem;"><span class="icon" aria-hidden="true">📺</span><h2 class="section-title" style="margin:0;">More Videos</h2></div>
        </div>
        <div class="video-grid" id="related-grid"></div>
      </section>
    </div>

    <!-- Footer -->
    <footer class="footer">
      <div class="container">
        <div class="footer-content">
          <span class="footer-brand">StreamXvault</span>
          <span class="footer-text">© 2026 StreamXvault. All rights reserved.</span>
        </div>
      </div>
    </footer>
  </main>

  <!-- Toast Container -->
  <div class="toast-container" id="toast-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.8/dist/hls.min.js"></script>
  <script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>
  <script src="https://imasdk.googleapis.com/js/sdkloader/ima3.js" defer></script>
  <script src="/js/utils.js"></script>
  <script src="/js/player.js?v=4"></script>
  
</body>
</html>
